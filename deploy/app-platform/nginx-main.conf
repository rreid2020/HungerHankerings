worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # App Platform terminates TLS and forwards the visitor in X-Forwarded-For; without this every
    # request would look like it came from the load balancer, so all rate limits below (and the
    # X-Real-IP we pass to Next) would apply to all customers as one bucket. `real_ip_recursive on`
    # walks the chain right-to-left past trusted (internal) hops to the real client.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 100.64.0.0/10;
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from ::1/128;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Higher API ceiling: hydration sends several Shop GraphQL POSTs quickly; a low rate risks stalls under load.
    limit_req_zone $binary_remote_addr zone=api:10m rate=80r/s;
    limit_req_zone $binary_remote_addr zone=web:10m rate=120r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;
    # Public contact form: humans send one message, bots send thousands. Survives app restarts,
    # unlike the in-process guard in storefront/lib/spam-guard.ts.
    limit_req_zone $binary_remote_addr zone=leads:10m rate=6r/m;

    # Load balancers (e.g. App Platform) terminate TLS; the hop to this nginx is often HTTP.
    # Forward the client's scheme so Next.js / Clerk see https and set cookies and redirects correctly.
    map $http_x_forwarded_proto $pass_forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    include /etc/nginx/http.d/*.conf;
}
